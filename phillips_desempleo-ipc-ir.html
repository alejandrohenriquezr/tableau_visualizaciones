<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Curva de Phillips - Chile</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fafafa;
    margin: 0;
    padding: 24px;
    color: #222;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  p.subtitle { margin: 0 0 20px 0; color: #666; font-size: 13px; }
  #wrap {
    max-width: 920px;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    position: relative;
  }
  #chartContainer { position: relative; width: 100%; }
  canvas { display: block; width: 100%; }
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(20,20,20,0.92);
    color: white;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    display: none;
    white-space: nowrap;
    z-index: 10;
    transform: translate(-50%, -110%);
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  input[type=range] { flex: 1; }
  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 10px;
    font-size: 12px;
    color: #555;
  }
  .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="wrap">
  <h1>Curva de Phillips &mdash; Chile</h1>
  <p class="subtitle">Desempleo (ENE) vs. Inflación 12 meses (IPC General) &middot; tamaño del punto = var. 12 meses del Índice de Remuneraciones</p>

  <div id="chartContainer">
    <canvas id="chart"></canvas>
    <div id="tooltip"></div>
  </div>

  <div id="controls">
    <button id="playBtn">&#9654; Play</button>
    <input type="range" id="scrub" min="0" max="29" value="29">
    <span id="frameLabel" style="min-width:80px; font-size:13px; color:#555;"></span>
    <button id="downloadBtn">&#11015; Descargar .xlsx</button>
  </div>

  <div id="legend">
    <span><span class="swatch" style="background:#ffb75e;"></span>Inflación &gt; 3% (meta)</span>
    <span><span class="swatch" style="background:#87ceeb;"></span>Inflación &le; 3% (meta)</span>
    <span>Tamaño del punto &prop; var. 12m Índice de Remuneraciones</span>
  </div>
</div>

<script>
(function () {
  const rawData = [{"x": 8.504, "y": 3.8, "ir": 2.781, "label": "Jan-2024"}, {"x": 8.678, "y": 4.5, "ir": 2.236, "label": "Feb-2024"}, {"x": 8.524, "y": 3.7, "ir": 2.432, "label": "Mar-2024"}, {"x": 8.313, "y": 4.0, "ir": 2.334, "label": "Apr-2024"}, {"x": 8.348, "y": 4.1, "ir": 1.967, "label": "May-2024"}, {"x": 8.684, "y": 4.2, "ir": 2.437, "label": "Jun-2024"}, {"x": 8.901, "y": 4.6, "ir": 3.284, "label": "Jul-2024"}, {"x": 8.742, "y": 4.7, "ir": 3.637, "label": "Aug-2024"}, {"x": 8.58, "y": 4.1, "ir": 3.737, "label": "Sep-2024"}, {"x": 8.218, "y": 4.7, "ir": 3.024, "label": "Oct-2024"}, {"x": 8.08, "y": 4.2, "ir": 3.627, "label": "Nov-2024"}, {"x": 8.023, "y": 4.5, "ir": 3.177, "label": "Dec-2024"}, {"x": 8.382, "y": 4.9, "ir": 3.178, "label": "Jan-2025"}, {"x": 8.709, "y": 4.7, "ir": 3.531, "label": "Feb-2025"}, {"x": 8.841, "y": 4.9, "ir": 3.229, "label": "Mar-2025"}, {"x": 8.943, "y": 4.5, "ir": 3.48, "label": "Apr-2025"}, {"x": 8.893, "y": 4.4, "ir": 3.455, "label": "May-2025"}, {"x": 8.699, "y": 4.1, "ir": 3.263, "label": "Jun-2025"}, {"x": 8.561, "y": 4.3, "ir": 1.99, "label": "Jul-2025"}, {"x": 8.529, "y": 4.0, "ir": 2.022, "label": "Aug-2025"}, {"x": 8.448, "y": 4.4, "ir": 1.403, "label": "Sep-2025"}, {"x": 8.424, "y": 3.4, "ir": 2.417, "label": "Oct-2025"}, {"x": 8.05, "y": 3.4, "ir": 2.476, "label": "Nov-2025"}, {"x": 8.285, "y": 3.5, "ir": 2.522, "label": "Dec-2025"}, {"x": 8.33, "y": 2.8, "ir": 2.077, "label": "Jan-2026"}, {"x": 8.93, "y": 2.4, "ir": 2.566, "label": "Feb-2026"}, {"x": 9.109, "y": 2.8, "ir": 2.261, "label": "Mar-2026"}, {"x": 9.438, "y": 4.0, "ir": 1.639, "label": "Apr-2026"}, {"x": 9.441, "y": 3.9, "ir": 3.286, "label": "May-2026"}, {"x": 9.529, "y": 4.3, "ir": 3.268, "label": "Jun-2026"}];
  const META = 3.0;
  const IR_MIN = 1.403;
  const IR_MAX = 3.737;
  const N = rawData.length;

  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('chartContainer');
  const tooltip = document.getElementById('tooltip');
  const playBtn = document.getElementById('playBtn');
  const scrub = document.getElementById('scrub');
  const frameLabel = document.getElementById('frameLabel');

  const MARGIN = { left: 64, right: 24, top: 24, bottom: 56 };
  const CSS_HEIGHT = 440;
  const DURACION_TRAMO_MS = 700;

  const xs = rawData.map(d => d.x);
  const ys = rawData.map(d => d.y);
  const xMin = Math.min(...xs) - 0.4, xMax = Math.max(...xs) + 0.4;
  const yMin = Math.min(...ys, META) - 0.8, yMax = Math.max(...ys, META) + 0.8;

  function radioPorIR(ir) {
    if (IR_MAX === IR_MIN) return 9;
    const t = (ir - IR_MIN) / (IR_MAX - IR_MIN);
    return 4 + t * 16;
  }
  const radios = rawData.map(d => radioPorIR(d.ir));
  const colores = rawData.map(d => d.y > META ? 'rgba(255,140,0,0.8)' : 'rgba(30,144,255,0.8)');
  const coloresLinea = rawData.map(d => d.y > META ? 'rgba(255,183,94,0.95)' : 'rgba(135,206,250,0.95)');

  let cssWidth = 0, dpr = window.devicePixelRatio || 1;

  function resize() {
    cssWidth = container.clientWidth;
    canvas.style.height = CSS_HEIGHT + 'px';
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(CSS_HEIGHT * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(frame);
  }

  function px(x) {
    const plotW = cssWidth - MARGIN.left - MARGIN.right;
    return MARGIN.left + (x - xMin) / (xMax - xMin) * plotW;
  }
  function py(y) {
    const plotH = CSS_HEIGHT - MARGIN.top - MARGIN.bottom;
    return MARGIN.top + (1 - (y - yMin) / (yMax - yMin)) * plotH;
  }

  function niceTicks(min, max, count) {
    const range = max - min;
    const step = range / count;
    const mag = Math.pow(10, Math.floor(Math.log10(step)));
    const norm = step / mag;
    let niceStep;
    if (norm < 1.5) niceStep = 1 * mag;
    else if (norm < 3) niceStep = 2 * mag;
    else if (norm < 7) niceStep = 5 * mag;
    else niceStep = 10 * mag;
    const ticks = [];
    let t = Math.ceil(min / niceStep) * niceStep;
    for (; t <= max + 1e-9; t += niceStep) ticks.push(Math.round(t * 100) / 100);
    return ticks;
  }

  function drawAxes() {
    const plotLeft = MARGIN.left, plotRight = cssWidth - MARGIN.right;
    const plotTop = MARGIN.top, plotBottom = CSS_HEIGHT - MARGIN.bottom;

    ctx.strokeStyle = '#e5e5e5';
    ctx.fillStyle = '#666';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.lineWidth = 1;

    // Grid + ticks eje X
    const xTicks = niceTicks(xMin, xMax, 7);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    xTicks.forEach(t => {
      const xp = px(t);
      ctx.beginPath();
      ctx.moveTo(xp, plotTop);
      ctx.lineTo(xp, plotBottom);
      ctx.stroke();
      ctx.fillText(t.toFixed(1), xp, plotBottom + 8);
    });

    // Grid + ticks eje Y
    const yTicks = niceTicks(yMin, yMax, 6);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    yTicks.forEach(t => {
      const yp = py(t);
      ctx.beginPath();
      ctx.moveTo(plotLeft, yp);
      ctx.lineTo(plotRight, yp);
      ctx.stroke();
      ctx.fillText(t.toFixed(1), plotLeft - 8, yp);
    });

    // Ejes (bordes)
    ctx.strokeStyle = '#999';
    ctx.beginPath();
    ctx.moveTo(plotLeft, plotTop);
    ctx.lineTo(plotLeft, plotBottom);
    ctx.lineTo(plotRight, plotBottom);
    ctx.stroke();

    // Etiquetas de ejes
    ctx.fillStyle = '#333';
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Tasa de Desocupación (%)', (plotLeft + plotRight) / 2, CSS_HEIGHT - 8);

    ctx.save();
    ctx.translate(16, (plotTop + plotBottom) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('Inflación - Variación 12 meses IPC (%)', 0, 0);
    ctx.restore();

    // Línea meta de inflación
    const metaY = py(META);
    ctx.save();
    ctx.strokeStyle = '#999';
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(plotLeft, metaY);
    ctx.lineTo(plotRight, metaY);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#777';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('Meta de inflación (3%)', plotLeft + 6, metaY - 4);
  }

  let frame = N - 1;
  let playing = false;
  let animationId = null;

  // Dibuja los períodos ya alcanzados y, opcionalmente, un punto móvil entre
  // el último período completo y el siguiente.
  function draw(hasta, progreso = 1) {
    ctx.clearRect(0, 0, cssWidth, CSS_HEIGHT);
    drawAxes();

    // Segmentos de la trayectoria coloreados según meta
    for (let i = 0; i < hasta; i++) {
      const x0 = px(rawData[i].x), y0 = py(rawData[i].y);
      const x1 = px(rawData[i + 1].x), y1 = py(rawData[i + 1].y);
      const avg = (rawData[i].y + rawData[i + 1].y) / 2;
      ctx.strokeStyle = avg > META ? 'rgba(255,183,94,0.95)' : 'rgba(135,206,250,0.95)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }

    // Durante la reproducción se extiende gradualmente el tramo siguiente.
    if (progreso < 1 && hasta < N - 1) {
      const actual = rawData[hasta];
      const siguiente = rawData[hasta + 1];
      const x0 = px(actual.x), y0 = py(actual.y);
      const x1 = px(siguiente.x), y1 = py(siguiente.y);
      const xm = x0 + (x1 - x0) * progreso;
      const ym = y0 + (y1 - y0) * progreso;
      const inflacionMedia = (actual.y + siguiente.y) / 2;

      ctx.strokeStyle = inflacionMedia > META
        ? 'rgba(255,183,94,0.95)'
        : 'rgba(135,206,250,0.95)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(xm, ym);
      ctx.stroke();
    }

    // Puntos revelados hasta el frame actual
    for (let i = 0; i <= hasta; i++) {
      const xp = px(rawData[i].x), yp = py(rawData[i].y);
      ctx.beginPath();
      ctx.arc(xp, yp, radios[i], 0, Math.PI * 2);
      ctx.fillStyle = colores[i];
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Interpola posición, radio y color del punto que viaja al período siguiente.
    if (progreso < 1 && hasta < N - 1) {
      const actual = rawData[hasta];
      const siguiente = rawData[hasta + 1];
      const x = actual.x + (siguiente.x - actual.x) * progreso;
      const y = actual.y + (siguiente.y - actual.y) * progreso;
      const radio = radios[hasta] + (radios[hasta + 1] - radios[hasta]) * progreso;

      ctx.beginPath();
      ctx.arc(px(x), py(y), radio, 0, Math.PI * 2);
      ctx.fillStyle = y > META ? 'rgba(255,140,0,0.8)' : 'rgba(30,144,255,0.8)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    if (progreso < 1 && hasta < N - 1) {
      frameLabel.textContent = rawData[hasta + 1].label;
    } else {
      frameLabel.textContent = rawData[hasta] ? rawData[hasta].label : '';
    }
  }

  // --- Tooltip por proximidad del mouse ---
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    let found = -1, bestDist = Infinity;
    for (let i = 0; i <= frame; i++) {
      const xp = px(rawData[i].x), yp = py(rawData[i].y);
      const d = Math.hypot(mx - xp, my - yp);
      if (d < radios[i] + 6 && d < bestDist) { bestDist = d; found = i; }
    }
    if (found >= 0) {
      const d = rawData[found];
      tooltip.style.display = 'block';
      tooltip.style.left = px(d.x) + 'px';
      tooltip.style.top = py(d.y) + 'px';
      tooltip.innerHTML =
        `<strong>${d.label}</strong><br>` +
        `Desempleo: ${d.x.toFixed(1)}%<br>` +
        `IPC (var. 12m): ${d.y.toFixed(1)}%<br>` +
        `IR (var. 12m): ${d.ir.toFixed(1)}%`;
    } else {
      tooltip.style.display = 'none';
    }
  });
  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

  // --- Reproducción progresiva (Play/Pause) ---
  function goTo(i) {
    if (animationId !== null) cancelAnimationFrame(animationId);
    animationId = null;
    frame = i;
    scrub.value = i;
    draw(i);
  }

  // Función de suavizado: parte y termina lentamente, sin saltos de velocidad.
  function easeInOutCubic(t) {
    return t < 0.5
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // Anima un tramo temporal completo y encadena el siguiente mientras Play siga activo.
  function animarSiguiente() {
    if (frame >= N - 1) {
      playing = false;
      playBtn.innerHTML = '&#9654; Play';
      animationId = null;
      return;
    }

    const desde = frame;
    let inicio = null;

    function tick(timestamp) {
      if (!playing) return;
      if (inicio === null) inicio = timestamp;

      const avanceLineal = Math.min((timestamp - inicio) / DURACION_TRAMO_MS, 1);
      draw(desde, easeInOutCubic(avanceLineal));

      if (avanceLineal < 1) {
        animationId = requestAnimationFrame(tick);
      } else {
        frame = desde + 1;
        scrub.value = frame;
        draw(frame);
        animationId = requestAnimationFrame(() => animarSiguiente());
      }
    }

    animationId = requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', () => {
    if (playing) {
      playing = false;
      playBtn.innerHTML = '&#9654; Play';
      if (animationId !== null) cancelAnimationFrame(animationId);
      animationId = null;
    } else {
      if (frame >= N - 1) goTo(0);
      playing = true;
      playBtn.innerHTML = '&#10074;&#10074; Pause';
      animarSiguiente();
    }
  });

  scrub.addEventListener('input', (e) => {
    playing = false;
    playBtn.innerHTML = '&#9654; Play';
    if (animationId !== null) cancelAnimationFrame(animationId);
    animationId = null;
    goTo(parseInt(e.target.value, 10));
  });

  window.addEventListener('resize', resize);
  resize();
  const downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.addEventListener('click', () => {
    try {
      const filas = rawData.map(d => ({
        'Mes-Año': d.label,
        'Desempleo (%)': d.x,
        'IPC var. 12m (%)': d.y,
        'IR var. 12m (%)': d.ir,
      }));
      const ws = XLSX.utils.json_to_sheet(filas);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Phillips');
      XLSX.writeFile(wb, 'datos_phillips.xlsx');
    } catch (err) {
      alert('No se pudo generar el archivo .xlsx (¿sin conexión a internet?). Intenta nuevamente con conexión.');
      console.error(err);
    }
  });
})();
</script>
</body>
</html>
